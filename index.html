<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ficha de notificación de alerta</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f4; }
    .formulario { background: #fff; padding: 20px; border-radius: 8px; max-width: 1000px; margin: auto; border: 3px solid #005a9e; }
    header { background: linear-gradient(90deg, #005a9e, #ff6600); padding: 15px; color: #fff; text-align: center; border-radius: 6px; margin-bottom: 20px; }
    header h1 { margin: 0; font-size: 20px; }
    .grid { display: grid; grid-template-columns: 200px 1fr 150px; gap: 15px; align-items: center; }
    .campo { display: contents; }
    .campo label { font-weight: bold; color: #005a9e; }
    .campo input, .campo textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .campo button { margin: 2px; padding: 8px; background: #0078d7; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    .campo button:hover { background: #ff6600; }
    #preview { margin-top: 20px; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ccc; }
    .acciones { text-align: center; margin-top: 20px; }
    .acciones button { padding: 10px 15px; margin: 5px; background: #005a9e; color: #fff; border: none; border-radius: 4px; }
    .acciones button:hover { background: #ff6600; }
  </style>
</head>
<body>
  <div class="formulario">
    <header>
      <h1>Institución Ejemplo - Formulario Institucional</h1>
    </header>
    <div class="grid">
      <!-- Campos -->
      <div class="campo"><label for="campo1">Nombre:</label><input type="text" id="campo1"><div><button onclick="grabar(1)">🎤</button><button onclick="limpiar(1)">❌</button></div></div>
      <div class="campo"><label for="campo2">Dirección:</label><input type="text" id="campo2"><div><button onclick="grabar(2)">🎤</button><button onclick="limpiar(2)">❌</button></div></div>
      <div class="campo"><label for="campo3">Teléfono:</label><input type="text" id="campo3"><div><button onclick="grabar(3)">🎤</button><button onclick="limpiar(3)">❌</button></div></div>
      <div class="campo"><label for="campo4">Correo:</label><input type="text" id="campo4"><div><button onclick="grabar(4)">🎤</button><button onclick="limpiar(4)">❌</button></div></div>
      <div class="campo"><label for="campo5">Institución:</label><input type="text" id="campo5"><div><button onclick="grabar(5)">🎤</button><button onclick="limpiar(5)">❌</button></div></div>
      <div class="campo"><label for="campo6">Cargo:</label><input type="text" id="campo6"><div><button onclick="grabar(6)">🎤</button><button onclick="limpiar(6)">❌</button></div></div>
      <div class="campo"><label for="campo7">Ciudad:</label><input type="text" id="campo7"><div><button onclick="grabar(7)">🎤</button><button onclick="limpiar(7)">❌</button></div></div>
      <div class="campo"><label for="campo8">País:</label><input type="text" id="campo8"><div><button onclick="grabar(8)">🎤</button><button onclick="limpiar(8)">❌</button></div></div>
      <div class="campo"><label for="campo9">Observaciones:</label><textarea id="campo9"></textarea><div><button onclick="grabar(9)">🎤</button><button onclick="limpiar(9)">❌</button></div></div>
    </div>

    <div class="acciones">
      <button onclick="mostrar()">Visualizar</button>
      <button onclick="generarPDF()">Generar PDF</button>
    </div>
  </div>

  <div id="preview"></div>

  <script>
    const reconocimiento = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    reconocimiento.lang = "es-ES";

    function grabar(numCampo) {
      reconocimiento.start();
      reconocimiento.onresult = (event) => {
        const texto = event.results[0][0].transcript;
        document.getElementById("campo" + numCampo).value = texto;
      };
    }

    function limpiar(numCampo) {
      document.getElementById("campo" + numCampo).value = "";
    }

    function mostrar() {
      let html = "<h3>Vista Previa</h3>";
      for (let i = 1; i <= 9; i++) {
        html += `<p><strong>${document.querySelector("label[for=campo"+i+"]").innerText}:</strong> ${document.getElementById("campo"+i).value}</p>`;
      }
      document.getElementById("preview").innerHTML = html;
    }

    async function generarPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: "mm", format: "a4" });

      // Configuración de márgenes individuales por campo
      const posiciones = {
        campo1: { x: 20, y: 40 },
        campo2: { x: 20, y: 60 },
        campo3: { x: 20, y: 80 },
        campo4: { x: 20, y: 100 },
        campo5: { x: 20, y: 120 },
        campo6: { x: 20, y: 140 },
        campo7: { x: 20, y: 160 },
        campo8: { x: 20, y: 180 },
        campo9: { x: 20, y: 200 }
      };

      doc.setTextColor(0, 0, 0);
      doc.setFontSize(12);

      // Solo información ingresada
      for (let i = 1; i <= 9; i++) {
        const valor = document.getElementById("campo"+i).value;
        if (valor.trim() !== "") {
          const pos = posiciones["campo" + i];
          doc.text(valor, pos.x, pos.y, { maxWidth: 170 });
        }
      }

      doc.save("Ficha de notificación de alerta.pdf");
    }
  </script>
</body>
</html>
